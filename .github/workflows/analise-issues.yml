name: Auditoria de Código e Criação de Issues

on:
  # Roda de forma automática toda segunda-feira às 08:00 UTC
  schedule:
    - cron: '0 8 * * 1'
  # Permite que você clique em um botão no GitHub para rodar manualmente quando quiser
  workflow_dispatch:

jobs:
  audit-and-issue:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read

    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Analisar Código com OpenRouter (Llama 3)
        id: ai_analysis
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER || secrets.OPENROUTER_API_KEY || secrets.LLM_API_KEY }}
        run: python3 .github/scripts/audit_repo.py

      - name: Criar a Issue Automaticamente
        uses: jasonetco/create-an-issue@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          filename: .github/issue-template.md
