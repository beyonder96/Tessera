name: CI - Qualidade, Testes e Segurança

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificacao-seguranca:
    name: 🔒 Varredura de Segurança & Secrets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verificar se há arquivos .env comitados
        run: |
          echo "Verificando se arquivos .env reais foram acidentalmente adicionados..."
          ENV_FILES=$(git ls-files | grep -E '(^|/)\.env(\..+)?$' | grep -v -E '\.env\.example$' || true)
          if [ -n "$ENV_FILES" ]; then
            echo "::error::Arquivo .env detectado no repositório! $ENV_FILES"
            exit 1
          fi
          echo "✅ Nenhum arquivo .env detectado."

      - name: Verificar padrões de chaves expostas no código
        run: |
          echo "Verificando padrões de chaves sensíveis (OpenRouter, Google, GitHub)..."
          FAIL=0

          if git grep -E 'sk-or-v1-[a-zA-Z0-9]{30,}' -- ':!*.system_generated*' ':!.agents*' || false; then
            echo "::error::Possível chave OpenRouter exposta em código!"
            FAIL=1
          fi

          if git grep -E 'ghp_[a-zA-Z0-9]{36}' -- ':!*.system_generated*' ':!.agents*' || false; then
            echo "::error::Possível token de acesso do GitHub exposto em código!"
            FAIL=1
          fi

          if [ $FAIL -ne 0 ]; then
            echo "::error::Credenciais detectadas no repositório. Utilize GitHub Secrets!"
            exit 1
          fi

          echo "✅ Nenhuma credencial exposta encontrada no código."

  testes-unitarios:
    name: 🧪 Testes Unitários Automatizados
    runs-on: ubuntu-latest
    needs: [verificacao-seguranca]
    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Dar permissão de execução ao gradlew
        run: chmod +x gradlew

      - name: Executar Testes Unitários (testDebugUnitTest)
        run: ./gradlew testDebugUnitTest --continue

      - name: Upload dos Relatórios de Teste (em caso de falha)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-testes-unitarios
          path: app/build/reports/tests/testDebugUnitTest/
          retention-days: 7
